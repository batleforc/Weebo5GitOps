{{ if .Values.grafana.enabled }}
# Stable admin credentials: the chart otherwise relies on `lookup` (unsupported
# by Argo CD) and regenerates the password on every render -> OutOfSync.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: grafana-admin-password
  namespace: grafana
spec:
  length: 32
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: grafana
spec:
  refreshPolicy: CreatedOnce
  target:
    name: grafana-admin
    template:
      data:
        admin-user: admin
        admin-password: "{{ "{{" }} .password {{ "}}" }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: grafana-admin-password
{{ end }}
