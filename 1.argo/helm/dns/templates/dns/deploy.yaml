apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-server
  namespace: {{ .Release.Namespace }}
  labels:
    app: dns-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dns-server
  template:
    metadata:
      annotations:
        checksum/config: '{{ include (print $.Template.BasePath "/dns/configmap.zone.yaml") . | sha256sum }}'
        checksum/named: '{{ include (print $.Template.BasePath "/dns/configmap.named.yaml") . | sha256sum }}'
      labels:
        app: dns-server
    spec:
      initContainers:
        # Les ConfigMaps sont en lecture seule : on copie les zones dans un volume inscriptible
        - name: copy-zones
          # L'image bind9 n'a pas de shell
          image: {{ .Values.bind9.initImage }}
          command:
            - sh
            - -c
            - |
              cp -L /zones-src/* /var/lib/bind/zones/
              # Serial = date/heure du démarrage (YYYYMMDDHH, UTC) pour qu'il ne régresse pas après un
              # redémarrage (updates dynamiques perdus) et que le secondaire OVH reprenne bien la zone.
              # On garde le serial du fichier s'il est plus grand.
              NEW=$(date -u +%Y%m%d%H)
              for f in /var/lib/bind/zones/*; do
                CUR=$(grep -oE '[0-9]+; *serial' "$f" | grep -oE '^[0-9]+')
                if [ -n "$CUR" ] && [ "$NEW" -gt "$CUR" ]; then
                  sed -i -E "s/[0-9]+(; *serial)/$NEW\1/" "$f"
                fi
                echo "$f: serial ${CUR} -> $(grep -oE '[0-9]+; *serial' "$f" | grep -oE '^[0-9]+')"
              done
              # L'utilisateur bind n'existe pas dans busybox : on ouvre les droits pour que named puisse écrire
              chmod 0777 /var/lib/bind/zones
              chmod 0666 /var/lib/bind/zones/*
          volumeMounts:
            - name: zone-map
              mountPath: /zones-src
              readOnly: true
            - name: zone-data
              mountPath: /var/lib/bind/zones
      containers:
        - name: dns-server
          image: {{ .Values.bind9.image }}:{{ .Values.bind9.tag }}
          args:
            - "--verbose"
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: loopback
              containerPort: 953
            - name: dns-tls
              containerPort: 443
              protocol: TCP
          volumeMounts:
            - name: named-map
              mountPath: /etc/bind/named.conf
              subPath: named.conf
            # Zones copiées par l'initContainer : modifiables par BIND (journal, dump des updates dynamiques)
            - name: zone-data
              mountPath: /var/lib/bind/zones
            - name: tsig-key
              mountPath: /val/lib/bind/pri/tsig.key
              subPath: tsig.key
            {{- if .Values.httpsNsServeur.enabled }}
            - name: ns-server-tls
              mountPath: /var/lib/bind/pri/ns-server-tls
            {{- end }}

          readinessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: dns-udp
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: zone-map
          configMap:
            name: zone-map
        - name: named-map
          configMap:
            name: named-map
        - name: tsig-key
          secret:
            secretName: tsig-key-secret
        - name: zone-data
          emptyDir: {}
        {{- if .Values.httpsNsServeur.enabled }}
        - name: ns-server-tls
          secret:
            secretName: ns-server-tls
        {{- end }}
