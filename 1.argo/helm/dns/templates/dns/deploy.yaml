apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-server
  namespace: {{ .Release.Namespace }}
  labels:
    app: dns-server
spec:
  replicas: 1
  # Un seul named à la fois sur le volume des zones (pas de double écriture journal/dump pendant un rollout)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dns-server
  template:
    metadata:
      annotations:
        checksum/config: '{{ include (print $.Template.BasePath "/dns/configmap.zone.yaml") . | sha256sum }}'
        checksum/named: '{{ include (print $.Template.BasePath "/dns/configmap.named.yaml") . | sha256sum }}'
        checksum/prepare-zones: '{{ .Files.Get "files/prepare-zones.sh" | sha256sum }}'
      labels:
        app: dns-server
    spec:
      initContainers:
        # Prépare les zones sur le volume persistant (voir files/prepare-zones.sh) :
        # source inchangée -> zone live conservée ; source modifiée -> fusion avec les enregistrements dynamiques.
        - name: prepare-zones
          # L'image ubuntu/bind9 n'a pas de shell
          image: {{ .Values.bind9.initImage }}
          command:
            - /bin/sh
            - /scripts/prepare-zones.sh
            - /zones-src
            - /var/lib/bind/zones
            {{- range $key, $value := .Values.zone }}
            - "{{ $key }}={{ $value.zone }}"
            {{- end }}
          volumeMounts:
            - name: zone-map
              mountPath: /zones-src
              readOnly: true
            - name: prepare-zones
              mountPath: /scripts
              readOnly: true
            - name: zone-data
              mountPath: /var/lib/bind/zones
      containers:
        - name: dns-server
          image: {{ .Values.bind9.image }}:{{ .Values.bind9.tag }}
          args:
            - "--verbose"
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: loopback
              containerPort: 953
            - name: dns-tls
              containerPort: 443
              protocol: TCP
          volumeMounts:
            - name: named-map
              mountPath: /etc/bind/named.conf
              subPath: named.conf
            # Zones préparées par l'initContainer, persistantes : BIND y écrit journal et dumps des updates dynamiques
            - name: zone-data
              mountPath: /var/lib/bind/zones
            # named (utilisateur bind) doit pouvoir écrire son pid et sa session key
            - name: run-named
              mountPath: /run/named
            - name: tsig-key
              mountPath: /val/lib/bind/pri/tsig.key
              subPath: tsig.key
            {{- if .Values.httpsNsServeur.enabled }}
            - name: ns-server-tls
              mountPath: /var/lib/bind/pri/ns-server-tls
            {{- end }}

          readinessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: dns-udp
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: zone-map
          configMap:
            name: zone-map
        - name: named-map
          configMap:
            name: named-map
        - name: tsig-key
          secret:
            secretName: tsig-key-secret
        - name: zone-data
          persistentVolumeClaim:
            claimName: dns-zone-data
        - name: prepare-zones
          configMap:
            name: prepare-zones
        - name: run-named
          emptyDir: {}
        {{- if .Values.httpsNsServeur.enabled }}
        - name: ns-server-tls
          secret:
            secretName: ns-server-tls
        {{- end }}
